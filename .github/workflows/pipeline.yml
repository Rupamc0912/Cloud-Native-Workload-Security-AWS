name: secure-container-pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job request an OIDC token for AWS
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secure-app:${{ github.sha }} .

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-app:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 30

      - name: Scan image with Trivy (full report, never fails)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-app:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Enforce vulnerability policy (blocks the build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-app:${{ github.sha }}
          format: table
          severity: ${{ vars.TRIVY_BLOCK_SEVERITY || 'CRITICAL,HIGH' }}
          ignore-unfixed: true
          exit-code: "1"

      - name: Debug OIDC claims (temporary)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0)%4) $0=$0"="; print }' | base64 -d | jq '{sub, aud, ref, event_name}'

      - name: Configure AWS credentials (OIDC, no stored keys)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/secure-workload-app:${{ github.sha }}"
          docker tag secure-app:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"